name: Build unsigned IPA

# One workflow, two uses: a tag builds the artefact that release page carries, and a manual run
# builds the current main for anybody who wants to re-sign it themselves. Nothing here is signed —
# the app is signed with a free personal team, so a build from CI can only ever be unsigned.

on:
  # Manual only, on purpose. A tag push used to build here, but the macOS queue is slow enough that
  # a release took half an hour to fail, and the same artefact comes out in a few minutes on the
  # machine that already has TDLib built — see `make release`. This workflow is the proof the build
  # works from a clean checkout, not the way a release gets out.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    # The app builds against the iOS 26 SDK, and XcodeGen writes the project in the format a 26.x
    # Xcode reads (`objectVersion 77`). An older image fails before compiling anything — "cannot be
    # opened because it is in a future Xcode project file format" — which is what macos-14 did.
    runs-on: macos-latest
    timeout-minutes: 90

    # One build at a time: TDLib and OpenSSL are compiled from source here, and two runs doing it
    # at once is forty minutes of a macOS runner spent on the same work.
    concurrency:
      group: ios-unsigned-ipa
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # A runner image carries several Xcodes and `xcode-select` points at one that is not
      # necessarily the newest; this build needs the newest, and says so plainly instead of failing
      # inside a compile.
      - name: Use the newest Xcode on the runner
        run: |
          app=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -q iphoneos26 || {
            echo "This build needs the iOS 26 SDK; the selected Xcode does not have it."
            xcodebuild -showsdks
            exit 1
          }

      # project.yml points configFiles at these two; they are gitignored because a developer's real
      # api_hash and team id live in them. The examples carry placeholders, which is all a build
      # needs — nothing here talks to Telegram.
      - name: Fill in the config placeholders
        run: |
          cp Config/Tdlib.example.xcconfig Config/Tdlib.xcconfig
          cp Config/Signing.example.xcconfig Config/Signing.xcconfig

      - name: Install XcodeGen and CMake
        run: brew install xcodegen cmake

      # TDLib and OpenSSL are built from the tags Scripts/build-tdlib.sh pins, because the
      # XCFrameworks are not in the repository.
      - name: Vendor TDLib
        run: make vendor

      - name: Build
        run: sh Scripts/build-unsigned-ipa.sh

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Doni-unsigned-ipa
          path: build/Doni.unsigned.ipa
