name: Doni
options:
  bundleIdPrefix: local.doni
  deploymentTarget:
    # MeloX's chrome is the system's own Liquid Glass — `TabView` with
    # `.tabViewBottomAccessory`, `GlassEffectContainer`, `.buttonStyle(.glass)`, zoom
    # transitions. None of it exists before iOS 26, and the device this runs on is iOS 27.
    iOS: "26.0"
    # The reference app's own desktop floor, and the one the lyrics renderer needs:
    # `onScrollGeometryChange` and `ScrollPhase` are macOS 15. The vendored TDLib/OpenSSL stay built
    # for 14, which costs nothing — a library's floor below the app's is simply a library that runs.
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: vi
  generationTag: M0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The app's red, from Assets.xcassets/AccentColor.colorset. `.tint()` does not reach the system
    # chrome — a macOS sidebar's selected row, an alert's default button, a slider's fill read this
    # value instead — so without it the desktop's sidebar stays the blue of the system accent. This is
    # how the reference does it too (`ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME = AccentColor`).
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Unsigned by default so `make build` stays a pure compile+link gate. Device
    # runs opt in with CODE_SIGNING_ALLOWED=YES (see `make device`).
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DONI_TEAM_ID}
    # One version, two numbers, both bumped together. `MARKETING_VERSION` is what the About screen
    # shows and what a release tag has to say; `CURRENT_PROJECT_VERSION` carries the same version in
    # its digits — 90 | major | minor | patch, so 9010000 is 1.0.0 — which is how a build number on
    # its own can be compared to a release tag (`App/AppVersion.swift`). The scheme is MeloX's, with
    # Doni's prefix.
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "9010006"

packages:
  Support:
    path: Packages/Support
  TelegramDesignSystem:
    path: Packages/TelegramDesignSystem
  # The lyrics screen, transcribed from the reference app's sources. It is a package rather
  # than a folder of UI because the transcription is Swift 5 and the app is Swift 6.
  DoniLyrics:
    path: Packages/DoniLyrics
  # The desktop lyrics column, transcribed from the reference's `MeloXDesktop` target. It is
  # a second package because the reference names its desktop types the same as its iOS ones,
  # and one module cannot hold both; the model is imported from DoniLyrics, not copied.
  DoniLyricsDesktop:
    path: Packages/DoniLyricsDesktop
  TdSession:
    path: Packages/TdSession
  TdBridge:
    path: Packages/TdBridge

configFiles:
  Debug: Config/Tdlib.xcconfig
  Release: Config/Tdlib.xcconfig

targets:
  Doni:
    type: application
    platform: iOS
    sources:
      - App
      - UI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Doni
        # The two version numbers come from the build settings below, not from XcodeGen's defaults —
        # written as placeholders, which is what makes Xcode substitute them when it copies the
        # plist into the bundle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # MTProto identifies the application, not the user, so these have to be
        # in the bundle. They come from the gitignored Config/Tdlib.xcconfig;
        # the user's session is separate and goes to the Keychain.
        TDLibApiId: $(TDLIB_API_ID)
        TDLibApiHash: $(TDLIB_API_HASH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.doni.app
        # The icon lives in App/Assets.xcassets, which XcodeGen picks up with the rest of the App
        # folder; this names which set in it is the app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Support
      - package: TelegramDesignSystem
      - package: DoniLyrics
      - package: TdSession
      - package: TdBridge

  # The Mac app. It is a second target rather than a Catalyst setting because
  # Catalyst still has no AVAudioSession and would keep the iPhone's chrome; and
  # its sources are `Mac/` plus the parts of `App/` that are not iOS-shaped.
  #
  # The core is shared, not copied — which is the whole argument against the
  # reference app's method (112 files byte-identical between its two targets and
  # 64 diverged, so every later fix has to happen twice). What is excluded below
  # is excluded because it is genuinely iOS, not because it is inconvenient:
  # `Player` owns AVAudioSession, `CoverArtwork` is the UIImage hub that Library,
  # LibraryIndexer, StorageTally and TelegramSession all hang off, and `DoniApp`
  # is the other target's `@main`.
  DoniMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - path: App
        excludes:
          - "Info.plist"
          # The other target's entry point; two `@main` in one binary is not a thing.
          - "DoniApp.swift"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Doni
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSApplicationCategoryType: public.app-category.music
        # MTProto identifies the application, not the user, so the same two values
        # the phone build reads come from the same gitignored xcconfig.
        TDLibApiId: $(TDLIB_API_ID)
        TDLibApiHash: $(TDLIB_API_HASH)
    settings:
      base:
        # A separate identifier on purpose: two apps with one bundle id would share
        # one Keychain item and one TDLib directory on the same machine.
        PRODUCT_BUNDLE_IDENTIFIER: local.doni.mac
        # The same catalog the phone compiles, now carrying a `mac` idiom beside the iOS one: one
        # master 1024, one icon, and `DoniLogo`'s `Image("DoniMark")` resolves on both platforms.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Support
      - package: TelegramDesignSystem
      - package: DoniLyrics
      # The reference's own desktop lyrics column, macOS-only by construction.
      - package: DoniLyricsDesktop
      - package: TdSession
      - package: TdBridge

schemes:
  Doni:
    build:
      targets:
        Doni: all
    run:
      config: Debug
  DoniMac:
    build:
      targets:
        DoniMac: all
    run:
      config: Debug
