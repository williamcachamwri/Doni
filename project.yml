name: Doni
options:
  bundleIdPrefix: local.doni
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi
  generationTag: M0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Unsigned by default so `make build` stays a pure compile+link gate. Device
    # runs opt in with CODE_SIGNING_ALLOWED=YES (see `make device`).
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DONI_TEAM_ID}

packages:
  Support:
    path: Packages/Support
  TelegramDesignSystem:
    path: Packages/TelegramDesignSystem
  TdSession:
    path: Packages/TdSession
  TdBridge:
    path: Packages/TdBridge

configFiles:
  Debug: Config/Tdlib.xcconfig
  Release: Config/Tdlib.xcconfig

targets:
  Doni:
    type: application
    platform: iOS
    sources:
      - App
      - UI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Doni
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # MTProto identifies the application, not the user, so these have to be
        # in the bundle. They come from the gitignored Config/Tdlib.xcconfig;
        # the user's session is separate and goes to the Keychain.
        TDLibApiId: $(TDLIB_API_ID)
        TDLibApiHash: $(TDLIB_API_HASH)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.doni.app
    dependencies:
      - package: Support
      - package: TelegramDesignSystem
      - package: TdSession
      - package: TdBridge

schemes:
  Doni:
    build:
      targets:
        Doni: all
    run:
      config: Debug
