name: Doni
options:
  bundleIdPrefix: local.doni
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi
  generationTag: M0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual

packages:
  Support:
    path: Packages/Support
  TelegramDesignSystem:
    path: Packages/TelegramDesignSystem
  TdBridge:
    path: Packages/TdBridge

targets:
  Doni:
    type: application
    platform: iOS
    sources:
      - App
      - UI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Doni
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.doni.app
    dependencies:
      - package: TelegramDesignSystem
      - package: TdBridge

schemes:
  Doni:
    build:
      targets:
        Doni: all
    run:
      config: Debug
